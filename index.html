<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Employee Bank Details</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background: #f5f5f5;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }

  .card {
    background: #fff;
    border-radius: 16px;
    padding: 36px 32px;
    width: 100%;
    max-width: 480px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 24px;
  }
  .logo-icon {
    width: 48px; height: 48px;
    display: flex; align-items: center; justify-content: center;
  }
  .logo-icon img { width: 48px; height: 48px; object-fit: contain; }
  .logo-text { font-size: 16px; font-weight: 600; color: #111; }

  h1 { font-size: 20px; font-weight: 600; color: #111; margin-bottom: 28px; }

  .field { margin-bottom: 16px; }
  label { display: block; font-size: 13px; font-weight: 500; color: #444; margin-bottom: 6px; }

  input, select {
    width: 100%;
    padding: 11px 14px;
    border: 1.5px solid #e0e0e0;
    border-radius: 10px;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    color: #111;
    background: #fff;
    outline: none;
    transition: border-color 0.2s;
    -webkit-appearance: none;
    appearance: none;
  }
  input:focus, select:focus { border-color: #E8622A; }
  input::placeholder { color: #bbb; }

  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .divider { border: none; border-top: 1px solid #f0f0f0; margin: 20px 0; }

  .section-title {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #E8622A;
    margin-bottom: 14px;
  }

  button {
    width: 100%;
    margin-top: 8px;
    padding: 13px;
    background: #E8622A;
    color: white;
    border: none;
    border-radius: 10px;
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }
  button:hover { background: #c94d1a; }
  button:disabled { background: #ccc; cursor: not-allowed; }

  .toast {
    position: fixed; bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(10px);
    background: #222; color: #fff;
    padding: 12px 20px; border-radius: 10px;
    font-size: 13px; opacity: 0;
    transition: all 0.3s; z-index: 999;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.green { background: #6BBF3E; }

  @media (max-width: 480px) {
    .card { padding: 24px 18px; }
    .row { grid-template-columns: 1fr; }
  }
</style>
</head>

  <h1>Employee Bank Details Form</h1>

  <div class="section-title">Personal Info</div>

  <div class="field">
    <label>Full Name</label>
    <input type="text" id="fullName" placeholder="Muhammad Ali"/>
  </div>

  <div class="row">
    <div class="field">
      <label>Designation</label>
      <input type="text" id="designation" placeholder="e.g. Manager"/>
    </div>
    <div class="field">
      <label>Department</label>
      <input type="text" id="department" placeholder="e.g. Finance"/>
    </div>
  </div>

  <hr class="divider"/>
  <div class="section-title">Bank Info</div>

  <div class="field">
    <label>Bank Name</label>
    <select id="bankName">
      <option value="">— Select Bank —</option>

      <optgroup label="Large Commercial Banks">
        <option>Habib Bank Limited (HBL)</option>
        <option>United Bank Limited (UBL)</option>
        <option>MCB Bank Limited</option>
        <option>Allied Bank Limited (ABL)</option>
        <option>National Bank of Pakistan (NBP)</option>
      </optgroup>

      <optgroup label="Private Banks">
        <option>Bank Alfalah</option>
        <option>Bank Al-Habib</option>
        <option>Askari Bank</option>
        <option>Faysal Bank</option>
        <option>JS Bank</option>
        <option>Habib Metropolitan Bank</option>
        <option>Soneri Bank</option>
        <option>Bank of Punjab (BOP)</option>
        <option>Bank of Khyber (BOK)</option>
        <option>Silk Bank</option>
        <option>Summit Bank</option>
        <option>SAMBA Bank</option>
        <option>First Women Bank</option>
      </optgroup>

      <optgroup label="Islamic Banks">
        <option>Meezan Bank</option>
        <option>Dubai Islamic Bank Pakistan</option>
        <option>BankIslami Pakistan</option>
        <option>Al Baraka Bank Pakistan</option>
        <option>MCB Islamic Bank</option>
      </optgroup>

      <option>Other</option>
    </select>
  </div>

  <div class="field">
    <label>Account Title</label>
    <input type="text" id="accountTitle" placeholder="Name as on bank account"/>
  </div>

  <div class="row">
    <div class="field">
      <label>Account Number</label>
      <input type="text" id="accountNumber" placeholder="0123456789012" inputmode="numeric"/>
    </div>
    <div class="field">
      <label>Branch Code</label>
      <input type="text" id="branchCode" placeholder="0123" inputmode="numeric"/>
    </div>
  </div>

  <button id="btn" onclick="submitData()">Submit</button>
</div>

<div class="toast" id="toast"></div>

<script>
  // 🔧 Replace with your Google Apps Script Web App URL
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz5EYx5sLPfcj_ZfNQCyPqyhOakAfP_fWk3AQUod5r2dyKVPueASwFNcqsruKjDAlbU/exec";

  function showToast(msg, green) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show' + (green ? ' green' : '');
    setTimeout(() => t.className = 'toast', 3500);
  }

  async function submitData() {
    const fields = {
      fullName:      document.getElementById('fullName').value.trim(),
      designation:   document.getElementById('designation').value.trim(),
      department:    document.getElementById('department').value.trim(),
      bankName:      document.getElementById('bankName').value,
      accountTitle:  document.getElementById('accountTitle').value.trim(),
      accountNumber: document.getElementById('accountNumber').value.trim(),
      branchCode:    document.getElementById('branchCode').value.trim(),
    };

    if (Object.values(fields).some(v => !v)) {
      showToast('⚠️ Please fill all fields');
      return;
    }

    fields.submittedAt = new Date().toLocaleString('en-PK', { timeZone: 'Asia/Karachi' });

    const btn = document.getElementById('btn');
    btn.disabled = true;
    btn.textContent = 'Submitting...';

    try {
      await fetch(SCRIPT_URL, {
        method: 'POST', mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(fields)
      });
      showToast('✅ Submitted successfully!', true);
      document.querySelectorAll('input').forEach(i => i.value = '');
      document.querySelectorAll('select').forEach(s => s.value = '');
    } catch {
      showToast('❌ Failed. Please try again.');
    }

    btn.disabled = false;
    btn.textContent = 'Submit';
  }
</script>

</body>
</html>
